stages:
  train_linear:
    cmd: python linear_reg_learn.py
    deps:
    - linear_reg_learn.py
    - prepare/X_train.csv
    - prepare/y_train.csv
    outs:
    - models/linear_model.pkl
    metrics:
    - results/linear/metrics_learn.json:
        cache: false
  validate_linear:
    cmd: python linear_reg_valid.py
    deps:
    - linear_reg_valid.py
    - models/linear_model.pkl
    - prepare/X_val.csv
    - prepare/y_val.csv
    metrics:
    - results/linear/metrics_valid.json:
        cache: false
  fullrun_linear:
    cmd: python linear_reg_full.py
    deps:
    - prepare/X_full.csv
    - prepare/y_full.csv
    - models/linear_model.pkl
    - linear_reg_full.py
    metrics:
    - results/linear/metrics_full.json



  train_tree:
    cmd: python tree_learn.py
    deps:
    - prepare/X_train.csv
    - prepare/y_train.csv
    - tree_learn.py
    outs:
    - models/tree_model.pkl
    - results/tree/tree_structure.png
    metrics:
    - results/tree/metrics_learn.json:
        cache: false
  validate_tree:
    cmd: python tree_valid.py
    deps:
    - models/tree_model.pkl
    - prepare/X_val.csv
    - prepare/y_val.csv
    - tree_valid.py
    outs:
    - results/tree/actual_vs_pred_valid.png
    - results/tree/residual_plot_valid.png
    metrics:
    - results/tree/metrics_valid.json:
        cache: false
  fullrun_tree:
    cmd: python tree_full.py
    deps:
    - models/tree_model.pkl
    - prepare/X_full.csv
    - prepare/y_full.csv
    - tree_full.py
    outs:
    - results/tree/actual_vs_pred_full.png
    - results/tree/residual_plot_full.png
    metrics:
    - results/tree/metrics_full.json:
        cache: false

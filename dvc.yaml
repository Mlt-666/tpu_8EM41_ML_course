stages:
  train_linear:
    cmd: python linear_reg_learn.py
    deps:
    - linear_reg_learn.py
    - prepare/X_train.csv
    - prepare/y_train.csv
    outs:
    - models/linear_model.pkl
    metrics:
    - results/linear/metrics_learn.json:
        cache: false
  validate_linear:
    cmd: python linear_reg_valid.py
    deps:
    - linear_reg_valid.py
    - models/linear_model.pkl
    - prepare/X_val.csv
    - prepare/y_val.csv
    metrics:
    - results/linear/metrics_valid.json:
        cache: false
  fullrun_linear:
    cmd: python linear_reg_full.py
    deps:
    - prepare/X_full.csv
    - prepare/y_full.csv
    - models/linear_model.pkl
    - linear_reg_full.py
    metrics:
    - results/linear/metrics_full.json



